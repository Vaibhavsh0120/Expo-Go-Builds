name: Build Expo Go (unsigned IPA for Sideloadly)

# One workflow for SDK 54-58. The dispatch form exposes only the SDK and
# optional release publishing; all source/toolchain settings resolve below.
# Source verification and build evidence: docs/SDK_SUPPORT.md.
on:
  workflow_dispatch:
    inputs:
      expo_sdk:
        description: "Expo Go SDK version to build"
        required: true
        type: choice
        options:
          - "58"
          - "57"
          - "56"
          - "55"
          - "54"
        default: "57"
      create_release:
        description: "Also publish this build as a GitHub Release (in addition to the always-uploaded Actions artifact)"
        required: false
        type: boolean
        default: false

concurrency:
  group: build-expo-go-${{ inputs.expo_sdk }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"
  EXPO_USE_SOURCE: "1"

jobs:
  # Resolve on Linux first so the same SDK case selects the macOS runner
  # as well as its tools. No extra user inputs or duplicated SDK matrix.
  resolve-config:
    name: Select SDK source and toolchain
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.config.outputs.sdk }}
      expo_ref: ${{ steps.config.outputs.expo_ref }}
      runner: ${{ steps.config.outputs.runner }}
      xcode_version: ${{ steps.config.outputs.xcode_version }}
      node_version: ${{ steps.config.outputs.node_version }}
      package_manager: ${{ steps.config.outputs.package_manager }}
      package_manager_version: ${{ steps.config.outputs.package_manager_version }}
      ruby_version: ${{ steps.config.outputs.ruby_version }}
      min_ios: ${{ steps.config.outputs.min_ios }}
      macros_mode: ${{ steps.config.outputs.macros_mode }}
      sdk_versions_path: ${{ steps.config.outputs.sdk_versions_path }}
      ipa_basename: ${{ steps.config.outputs.ipa_basename }}
      artifact_name: ${{ steps.config.outputs.artifact_name }}
    steps:
      - name: Resolve SDK-specific configuration
        id: config
        env:
          SDK: ${{ inputs.expo_sdk }}
        shell: bash
        run: |
          set -euo pipefail
          # Defaults verified on sdk-56/sdk-57; older/newer SDKs override
          # only the values that differ in their own source and CI.
          RUNNER="macos-26"
          XCODE_VERSION="26.4.1"
          NODE_VERSION="22.14.0"
          PACKAGE_MANAGER="pnpm"
          PACKAGE_MANAGER_VERSION="10"
          RUBY_VERSION="3.2.2"
          MIN_IOS="16.4"
          MACROS_MODE="shell"
          SDK_VERSIONS_PATH="apps/expo-go/sdkVersions.json"

          case "$SDK" in
            54)
              RUNNER="macos-15"
              # The release branch now imports DeclaredAgeRange (iOS 26).
              # Its old Xcode 16.4 CI pin no longer compiles Expo Go.
              XCODE_VERSION="26.2"
              PACKAGE_MANAGER="yarn"
              PACKAGE_MANAGER_VERSION="1.22.22"
              MIN_IOS="15.1"
              MACROS_MODE="legacy"
              SDK_VERSIONS_PATH="apps/expo-go/ios/Exponent/Supporting/sdkVersions.json"
              ;;
            55)
              RUNNER="macos-15"
              XCODE_VERSION="26.2"
              PACKAGE_MANAGER="yarn"
              PACKAGE_MANAGER_VERSION="1.22.22"
              MIN_IOS="15.1"
              ;;
            56|57)
              ;;
            58)
              NODE_VERSION="24"
              PACKAGE_MANAGER_VERSION="12.2.1"
              ;;
            *)
              echo "::error::Unsupported SDK. Choose 54, 55, 56, 57, or 58."
              exit 1
              ;;
          esac

          {
            echo "sdk=$SDK"
            echo "expo_ref=sdk-$SDK"
            echo "runner=$RUNNER"
            echo "xcode_version=$XCODE_VERSION"
            echo "node_version=$NODE_VERSION"
            echo "package_manager=$PACKAGE_MANAGER"
            echo "package_manager_version=$PACKAGE_MANAGER_VERSION"
            echo "ruby_version=$RUBY_VERSION"
            echo "min_ios=$MIN_IOS"
            echo "macros_mode=$MACROS_MODE"
            echo "sdk_versions_path=$SDK_VERSIONS_PATH"
            echo "ipa_basename=ExpoGo-SDK${SDK}-unsigned"
            echo "artifact_name=ExpoGo-SDK${SDK}-iOS"
          } >> "$GITHUB_OUTPUT"

          echo "SDK $SDK: sdk-$SDK on $RUNNER / Xcode $XCODE_VERSION"
          echo "Node $NODE_VERSION / $PACKAGE_MANAGER $PACKAGE_MANAGER_VERSION / Ruby $RUBY_VERSION"
          echo "Minimum iOS $MIN_IOS; unsigned physical-device build"

  build-expo-go-ios:
    name: Build Expo Go SDK ${{ needs.resolve-config.outputs.sdk }} (unsigned IPA)
    needs: resolve-config
    runs-on: ${{ needs.resolve-config.outputs.runner }}
    timeout-minutes: 180
    permissions:
      contents: write # Only used when the user ticks create_release.
    defaults:
      run:
        shell: bash
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/expo-src/Gemfile
    steps:
      - name: Runner diagnostics
        run: |
          echo "=== System ==="
          sw_vers
          uname -m
          echo "=== Xcode versions on this image ==="
          ls /Applications | grep -i Xcode || true
          echo "=== Current xcode-select ==="
          xcode-select -p
          echo "=== Disk space ==="
          df -h /

      - name: Select Xcode ${{ needs.resolve-config.outputs.xcode_version }}
        id: xcode
        run: |
          XCODE_APP="/Applications/Xcode_${{ needs.resolve-config.outputs.xcode_version }}.app"
          if [ -d "$XCODE_APP" ]; then
            sudo xcode-select --switch "$XCODE_APP"
            echo "Switched to $XCODE_APP"
          else
            echo "::warning::$XCODE_APP was not found on this runner image. \
          The image's Xcode line-up rotates over time (GitHub retires the \
          oldest build a few weeks after a new one ships). Falling back to \
          whatever is currently selected by default. Available versions:"
            ls /Applications | grep -i Xcode
          fi
          xcodebuild -version
          echo "version=$(xcodebuild -version | head -1 | cut -d ' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "=== iphoneos SDK ==="
          xcrun --sdk iphoneos --show-sdk-version

      - name: Force SSH->HTTPS rewrite for all github.com URLs
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout this repository (for patches/scripts)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout expo/expo @ ${{ needs.resolve-config.outputs.expo_ref }} (SDK ${{ needs.resolve-config.outputs.sdk }})
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: expo/expo
          ref: ${{ needs.resolve-config.outputs.expo_ref }}
          path: expo-src
          submodules: recursive
          lfs: true
          fetch-depth: 1

      - name: Record source commit and verify embedded SDK
        id: source
        working-directory: expo-src
        env:
          EXPECTED_SDK: ${{ needs.resolve-config.outputs.sdk }}
          SDK_VERSIONS_PATH: ${{ needs.resolve-config.outputs.sdk_versions_path }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          git log -1 --format="%H %ci %s"
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.env.SDK_VERSIONS_PATH, 'utf8'));
          const versions = data.sdkVersions || [data.sdkVersion];
          const expected = `${process.env.EXPECTED_SDK}.0.0`;
          if (!versions.includes(expected)) {
            throw new Error(`Expected SDK ${expected}, got ${JSON.stringify(data)}`);
          }
          console.log(`Embedded SDK confirmed: ${expected}`);
          NODE

      # Incomplete upstream backport; do not overwrite an upstream fix.
      # Provenance: patches/sdk56/SceneGeometry.swift and docs/SDK_56.md.
      - name: Apply known SDK 56 source patches
        if: ${{ needs.resolve-config.outputs.sdk == '56' }}
        run: |
          TARGET="expo-src/packages/expo-modules-core/ios/Utilities/SceneGeometry.swift"
          if [ -f "$TARGET" ]; then
            echo "$TARGET already exists in this checkout -- upstream appears to have fixed the incomplete sdk-56 backport. Skipping patch (patches/sdk56/SceneGeometry.swift is now unnecessary; consider removing it)."
          else
            mkdir -p "$(dirname "$TARGET")"
            cp patches/sdk56/SceneGeometry.swift "$TARGET"
            echo "Patched: copied patches/sdk56/SceneGeometry.swift -> $TARGET"
            echo "::notice::Applied a source patch for a known incomplete backport in expo/expo's sdk-56 branch (missing SceneGeometry.swift). See docs/SDK_56.md for details."
          fi

      - name: Install native build tools (cmake, ninja via Brewfile)
        working-directory: expo-src
        run: |
          brew bundle
          command -v cmake
          command -v ninja

      - name: Set up Node.js ${{ needs.resolve-config.outputs.node_version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ needs.resolve-config.outputs.node_version }}

      - name: Set up dependency tools
        env:
          PACKAGE_MANAGER: ${{ needs.resolve-config.outputs.package_manager }}
          PACKAGE_MANAGER_VERSION: ${{ needs.resolve-config.outputs.package_manager_version }}
        run: |
          # React Native's submodule uses Yarn Classic even on pnpm SDKs.
          if command -v corepack >/dev/null; then corepack disable; fi
          npm install --global yarn@1.22.22
          if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            npm install --global "pnpm@$PACKAGE_MANAGER_VERSION"
          fi
          "$PACKAGE_MANAGER" --version

      - name: Resolve dependency cache path
        id: dependency_cache
        working-directory: expo-src
        env:
          PACKAGE_MANAGER: ${{ needs.resolve-config.outputs.package_manager }}
        run: |
          if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            CACHE_PATH="$(pnpm store path --silent)"
          else
            CACHE_PATH="$(yarn cache dir --silent)"
          fi
          echo "path=$CACHE_PATH" >> "$GITHUB_OUTPUT"

      - name: Cache JS dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.dependency_cache.outputs.path }}
          key: js-${{ runner.os }}-${{ runner.arch }}-sdk${{ needs.resolve-config.outputs.sdk }}-${{ needs.resolve-config.outputs.package_manager_version }}-${{ hashFiles('expo-src/pnpm-lock.yaml', 'expo-src/yarn.lock') }}
          restore-keys: |
            js-${{ runner.os }}-${{ runner.arch }}-sdk${{ needs.resolve-config.outputs.sdk }}-${{ needs.resolve-config.outputs.package_manager_version }}-

      - name: Install JS dependencies (full monorepo)
        working-directory: expo-src
        env:
          PACKAGE_MANAGER: ${{ needs.resolve-config.outputs.package_manager }}
        run: '"$PACKAGE_MANAGER" install --frozen-lockfile'

      - name: Install React Native fork dependencies (react-native-lab)
        working-directory: expo-src
        env:
          PACKAGE_MANAGER: ${{ needs.resolve-config.outputs.package_manager }}
        run: |
          "$PACKAGE_MANAGER" run install:react-native-lab
          # Upstream's setup script can mask failures with `|| true`.
          # A real missing submodule install must stop before CocoaPods.
          test -d react-native-lab/react-native/node_modules

      - name: Build the expo package
        working-directory: expo-src/packages/expo
        env:
          PACKAGE_MANAGER: ${{ needs.resolve-config.outputs.package_manager }}
        run: '"$PACKAGE_MANAGER" run build'

      - name: Set up Ruby ${{ needs.resolve-config.outputs.ruby_version }} and locked gems
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde # v1
        with:
          ruby-version: ${{ needs.resolve-config.outputs.ruby_version }}
          bundler-cache: true
          working-directory: expo-src

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: expo-src/apps/expo-go/ios/Pods
          key: pods-${{ runner.os }}-sdk${{ needs.resolve-config.outputs.sdk }}-${{ needs.resolve-config.outputs.expo_ref }}-${{ hashFiles('expo-src/apps/expo-go/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-sdk${{ needs.resolve-config.outputs.sdk }}-${{ needs.resolve-config.outputs.expo_ref }}-

      - name: Generate EXBuildConstants.plist / GoogleService-Info.plist
        working-directory: expo-src
        env:
          MACROS_MODE: ${{ needs.resolve-config.outputs.macros_mode }}
          SRCROOT: ${{ github.workspace }}/expo-src/apps/expo-go/ios
          PODS_ROOT: ${{ github.workspace }}/expo-src/apps/expo-go/ios/Pods
          EXPO_TOOLS_DIR: ${{ github.workspace }}/expo-src/tools
          CONFIGURATION: Release
          APP_OWNER: Expo
        run: |
          if [ "$MACROS_MODE" = "legacy" ]; then
            # SDK 54's wrapper invokes expotools and reads Xcode env vars.
            bash apps/expo-go/ios/Build-Phases/generate-dynamic-macros.sh
          else
            bash apps/expo-go/ios/Build-Phases/generate-dynamic-macros.sh --configuration Release
          fi
          plutil -lint apps/expo-go/ios/Exponent/Supporting/EXBuildConstants.plist
          plutil -lint apps/expo-go/ios/Exponent/Supporting/GoogleService-Info.plist

      - name: pod install (CocoaPods 1.16.2)
        working-directory: expo-src/apps/expo-go/ios
        run: |
          bundle exec pod install --verbose 2>&1 | tee /tmp/pod-install.log | tail -150
          echo "Installed pods: $(ls Pods 2>/dev/null | wc -l | tr -d ' ')"

      - name: Verify workspace and scheme
        working-directory: expo-src
        run: |
          echo "=== Schemes in Exponent.xcworkspace ==="
          xcodebuild -workspace apps/expo-go/ios/Exponent.xcworkspace -list
          echo "=== iphoneos SDKs available ==="
          xcodebuild -showsdks | grep iphoneos

      # KEY FLAGS (all verified compatible with apps/expo-go/ios/Podfile
      # on both sdk-56 and sdk-57, which sets RCT_NEW_ARCH_ENABLED=1,
      # mac_catalyst_enabled: false on both):
      #   -sdk iphoneos                       physical device, NOT simulator
      #   -destination generic/platform=iOS   generic device build (no specific
      #                                        UDID needed -- this is what lets
      #                                        the build run on a GitHub runner
      #                                        with no device attached)
      #   CODE_SIGNING_ALLOWED=NO             skip signing entirely -- this is
      #   CODE_SIGNING_REQUIRED=NO            what makes an Apple Developer
      #   CODE_SIGN_IDENTITY=""               Program membership unnecessary to
      #   PROVISIONING_PROFILE=""             COMPILE. Sideloadly signs later.
      #   DEVELOPMENT_TEAM=""
      #   CODE_SIGN_ENTITLEMENTS=""           don't embed Exponent.entitlements
      #                                        (push/associated-domains/iCloud/
      #                                        Sign in with Apple) into the
      #                                        unsigned binary -- see README.md
      #                                        for why this matters for Sideloadly.
      #   ONLY_ACTIVE_ARCH=NO                 build all arches for the SDK (in
      #                                        practice iphoneos only ships arm64
      #                                        today, so this mostly just avoids
      #                                        relying on a connected device)
      #   SKIP_INSTALL=NO                     actually produce Expo Go.app in
      #                                        the build products, not just .o files
      # ───────────────────────────────────────────────────────────────
      - name: Build Expo Go (iphoneos, arm64, unsigned)
        working-directory: expo-src
        run: |
          set -euo pipefail
          BUILD_DIR="${GITHUB_WORKSPACE}/build-output"
          LOG_FILE="/tmp/xcodebuild.log"
          mkdir -p "$BUILD_DIR"

          xcodebuild \
            -workspace apps/expo-go/ios/Exponent.xcworkspace \
            -scheme "Expo Go" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            SKIP_INSTALL=NO \
            build 2>&1 | tee "$LOG_FILE" | (command -v xcbeautify >/dev/null && xcbeautify || cat)

          echo "xcodebuild completed successfully"

      - name: Find and verify the .app bundle
        id: find_app
        run: |
          BUILD_DIR="${GITHUB_WORKSPACE}/build-output"
          APP_PATH=$(find "$BUILD_DIR" -name "Expo Go.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find 'Expo Go.app' under $BUILD_DIR"
            find "$BUILD_DIR" -name "*.app" -type d 2>/dev/null
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found: $APP_PATH"

          BINARY="$APP_PATH/Expo Go"
          if [ ! -f "$BINARY" ]; then
            echo "::warning::Expected binary at '$BINARY' but it wasn't there (PRODUCT_NAME may have changed upstream). Falling back to searching for the executable."
            BINARY=$(find "$APP_PATH" -maxdepth 1 -type f -perm +111 | head -1)
          fi

          echo "=== 1. IPA/app bundle exists ==="
          echo "yes: $APP_PATH"

          echo "=== 2/3. file + Payload/*.app structure check (pre-zip) ==="
          file "$BINARY"

          echo "=== 4/5. lipo -info (must report arm64, must NOT report a simulator arch) ==="
          lipo -info "$BINARY"

          echo "=== otool -hv (verify Mach-O header / CPU type) ==="
          otool -hv "$BINARY" | head -5

          echo "=== otool -l | grep LC_BUILD_VERSION (confirms device, not simulator, build) ==="
          otool -l "$BINARY" | grep -A4 "LC_BUILD_VERSION" | head -20 || true

          echo "=== 6. Bundle identifier ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"

          echo "=== 7. Expo Go / app version ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"
          echo "Embedded Expo SDK version (from sdkVersions.json at checkout):"
          cat "${GITHUB_WORKSPACE}/expo-src/${{ needs.resolve-config.outputs.sdk_versions_path }}"

          echo "=== 8. Minimum iOS version ==="
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_PATH/Info.plist" 2>/dev/null || echo "(MinimumOSVersion not in Info.plist; see docs/SDK_SUPPORT.md for the verified Podfile value)"

          echo "=== 9. Build architecture ==="
          lipo -archs "$BINARY"

          echo "=== 10. codesign status (expected: unsigned at this stage) ==="
          codesign -dvvv "$APP_PATH" 2>&1 || echo "(unsigned -- expected; Sideloadly signs it next)"

          echo "=== size ==="
          du -sh "$APP_PATH"

      - name: Package IPA (Payload/Expo Go.app -> .ipa)
        id: package_ipa
        run: |
          APP_PATH="${{ steps.find_app.outputs.APP_PATH }}"
          IPA_DIR="${GITHUB_WORKSPACE}/ipa-output"
          PAYLOAD_DIR="$IPA_DIR/Payload"
          IPA_BASENAME="${{ needs.resolve-config.outputs.ipa_basename }}"
          IPA_PATH="$IPA_DIR/${IPA_BASENAME}.ipa"

          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          cd "$IPA_DIR"
          zip -rq "$IPA_PATH" Payload -x "*.DS_Store"

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "IPA_FILENAME=${IPA_BASENAME}.ipa" >> "$GITHUB_OUTPUT"

          echo "=== 2. IPA is a valid ZIP ==="
          unzip -t "$IPA_PATH" | tail -3

          echo "=== 3. Contains Payload/*.app ==="
          # Read the listing once. Piping a large ZIP listing to grep -m1
          # or head can make unzip fail with SIGPIPE under pipefail.
          unzip -l "$IPA_PATH" > "$IPA_DIR/ipa-contents.txt"
          grep -m1 "Payload/.*\.app/" "$IPA_DIR/ipa-contents.txt" && echo "confirmed" || { echo "::error::No Payload/*.app entry found in IPA"; exit 1; }

          echo "=== IPA contents (first 15 entries) ==="
          head -15 "$IPA_DIR/ipa-contents.txt"

          echo "=== 11. IPA file size ==="
          du -sh "$IPA_PATH"

          echo "=== Re-verify arch + plist inside the zipped IPA ==="
          TMP=$(mktemp -d)
          unzip -q "$IPA_PATH" -d "$TMP"
          INNER=$(find "$TMP/Payload" -maxdepth 1 -name "*.app" -type d | head -1)
          echo "4/5. lipo -info on zipped binary:"
          lipo -info "$INNER/$(basename "$INNER" .app)"
          echo "plutil -lint on zipped Info.plist:"
          plutil -lint "$INNER/Info.plist"
          rm -rf "$TMP"

          echo ""
          echo "::notice::This is an UNSIGNED physical-device IPA. It requires signing (e.g. with Sideloadly) before it can be installed on an iPhone/iPad. See docs/IPA_SIGNING.md."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.resolve-config.outputs.artifact_name }}
          path: ${{ steps.package_ipa.outputs.IPA_PATH }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload build/pod-install logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failure-logs-sdk${{ needs.resolve-config.outputs.sdk }}
          path: |
            /tmp/xcodebuild.log
            /tmp/pod-install.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish GitHub Release (optional, opt-in)
        if: ${{ success() && inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          SDK: ${{ needs.resolve-config.outputs.sdk }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          XCODE_VERSION: ${{ steps.xcode.outputs.version }}
          IPA_PATH: ${{ steps.package_ipa.outputs.IPA_PATH }}
        run: |
          TAG="expo-go-sdk${SDK}-$(date +%Y%m%d-%H%M%S)"
          TAGS_FILE="$RUNNER_TEMP/published-sdk-tags.txt"
          NOTES_FILE="$RUNNER_TEMP/release-notes-sdk${SDK}.md"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > "$TAGS_FILE"
          LATEST=$(python3 scripts/render_release_notes.py \
            --sdk "$SDK" --ipa "$IPA_PATH" \
            --source-sha "$SOURCE_SHA" --builder-sha "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --xcode "$XCODE_VERSION" --tags-file "$TAGS_FILE" --output "$NOTES_FILE")
          gh release create "$TAG" \
            "$IPA_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Expo Go SDK ${SDK} for iOS (unsigned)" \
            --latest="$LATEST" \
            --notes-file "$NOTES_FILE"

      - name: Build summary
        if: success()
        run: |
          echo "## Expo Go SDK ${{ needs.resolve-config.outputs.sdk }} -- unsigned IPA built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- SDK: \`${{ needs.resolve-config.outputs.sdk }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: expo/expo @ \`${{ needs.resolve-config.outputs.expo_ref }}\` (commit \`${{ steps.source.outputs.sha }}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bundle ID: \`host.exp.Exponent\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Min iOS: ${{ needs.resolve-config.outputs.min_ios }} (built with the iphoneos SDK from Xcode ${{ steps.xcode.outputs.version }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Architecture: arm64 (physical device, not simulator)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signing: none -- **unsigned physical-device IPA, requires signing before installation** (e.g. Sideloadly + your free Apple ID, see docs/IPA_SIGNING.md)" >> "$GITHUB_STEP_SUMMARY"
          echo "- IPA filename: \`${{ steps.package_ipa.outputs.IPA_FILENAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact name: \`${{ needs.resolve-config.outputs.artifact_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the \`${{ needs.resolve-config.outputs.artifact_name }}\` artifact from this run." >> "$GITHUB_STEP_SUMMARY"
